name: Deploy Portflip to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy and Build on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/my-portfolio

            echo "==> Pulling latest code from GitHub"
            git pull origin main

            echo "==> Activating virtual environment"
            source venv/bin/activate

            echo "==> Installing dependencies"
            pip install -r requirements.txt

            echo "==> Running sanity check (import the app)"
            python -c "import application; print('App imports fine')"

            echo "==> Restarting the app service"
            sudo systemctl restart portflip

            echo "==> Deployment finished successfully"
